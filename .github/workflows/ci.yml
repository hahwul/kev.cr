---
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crystal: [latest, "1.21.0"]
    steps:
      - uses: actions/checkout@v6
      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: ${{ matrix.crystal }}
      - name: Install dependencies
        run: shards install
      - name: Check formatting
        run: crystal tool format --check
      - name: Run tests
        run: crystal spec
      - name: Run examples (smoke check)
        # `examples/fetch.cr` hits the live CISA feed — skip it so CI is
        # not gated on network availability and the upstream isn't probed
        # on every push.
        run: |
          for f in examples/*.cr; do
            case "$(basename "$f")" in
              fetch.cr) echo "skipping $f (network-dependent)"; continue ;;
            esac
            echo "::group::$f"
            crystal run "$f"
            echo "::endgroup::"
          done
