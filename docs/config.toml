# =============================================================================
# Site Configuration
# =============================================================================

title = "kev.cr"
description = "A Crystal implementation of the CISA Known Exploited Vulnerabilities (KEV) catalog"
base_url = "https://kev.cr.hahwul.com"

# =============================================================================
# Plugins
# =============================================================================

[plugins]
processors = ["markdown"]

# =============================================================================
# Content Files
# =============================================================================

[content.files]
allow_extensions = ["jpg", "jpeg", "png", "gif", "svg", "webp"]

# =============================================================================
# Syntax Highlighting
# =============================================================================

[highlight]
enabled = true
theme = "github"
use_cdn = true

# =============================================================================
# Search Configuration
# =============================================================================

[search]
enabled = true
format = "fuse_json"
fields = ["title", "content"]
filename = "search.json"
exclude = []

# =============================================================================
# Sitemap
# =============================================================================

[sitemap]
enabled = true
filename = "sitemap.xml"
changefreq = "weekly"
priority = 0.5
exclude = []

# =============================================================================
# Robots.txt
# =============================================================================

[robots]
enabled = true
filename = "robots.txt"
rules = []

# =============================================================================
# LLMs.txt
# =============================================================================

[llms]
enabled = true
filename = "llms.txt"
instructions = "This is the documentation for kev.cr, a Crystal library that parses, queries, fetches, and serializes the CISA Known Exploited Vulnerabilities (KEV) catalog. See https://www.cisa.gov/known-exploited-vulnerabilities-catalog for the upstream feed."
full_enabled = false
full_filename = "llms-full.txt"

# =============================================================================
# RSS/Atom Feeds
# =============================================================================

[feeds]
enabled = false

# =============================================================================
# Pagination
# =============================================================================

[pagination]
enabled = false
per_page = 10

# =============================================================================
# Taxonomies
# =============================================================================

[[taxonomies]]
name = "tags"
feed = false
sitemap = false

# =============================================================================
# Markdown Configuration
# =============================================================================

[markdown]
safe = false
lazy_loading = false
emoji = false

# =============================================================================
# OG Image Auto-generation
# =============================================================================

[og.auto_image]
enabled = true
background = "#101014"
text_color = "#f2f2f5"
accent_color = "#6cadff"
secondary_color = "#a2a2ad"
