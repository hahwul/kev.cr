Lint/UselessAssign:
  Excluded:
    - spec/**/*.cr

Lint/NotNil:
  Excluded:
    - spec/**/*.cr

Style/MultilineStringLiteral:
  Excluded:
    - spec/**/*.cr

# Specs intentionally exercise select/reject methods on Enumerable.
Performance/SizeAfterFilter:
  Excluded:
    - spec/**/*.cr

Metrics/CyclomaticComplexity:
  MaxComplexity: 20

Naming/BlockParameterName:
  MinNameLength: 1
  AllowNamesEndingInNumbers: true
